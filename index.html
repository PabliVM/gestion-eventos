<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%235C1A2B%22/%3E%3Ctext x=%2216%22 y=%2222%22 font-size=%2216%22 text-anchor=%22middle%22 fill=%22%23F0BFAE%22 font-family=%22Georgia%22%3EBF%3C/text%3E%3C/svg%3E">
<title>El Broche Final · Gestión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=DM+Sans:opsz,wght@9..40,400..700&display=swap">
<style>
/* Layout: menú lateral burdeos fijo + área de trabajo sobria; en móvil, barra superior con menú desplazable. */
:root{
  --bg:#FAF7F3; --surface:#FFFDFB; --sunk:#F3EDE6; --line:#ECE3D9; --line-2:#DCCFC2;
  --ink:#2A1A1D; --ink-2:#5B4A4D; --muted:#8A7A7C;
  --brand:#5C1A2B; --brand-tint:#F5E9EA; --on-brand:#FBF3EE; --accent:#A8452F; --blush:#F0BFAE;
  --side:#4A1522; --side-ink:#F3E3DD; --side-muted:#C9A9A6; --side-hover:rgba(255,240,235,.07);
  --t-boda:#7A2639; --t-empresa:#B4573C; --t-wellness:#5E7048; --t-otro:#8A7A72; --t-reu:#3F5F7A; --ch-1:#A8344F; --ch-2:#0A82A8;
  --ok:#2F6B3E; --ok-bg:#E5F0E3; --warn:#8A5A12; --warn-bg:#F8ECD3; --off:#6E6265; --off-bg:#EEE8E4; --bad:#A12E2E; --bad-bg:#F8E1DF;
  --display:'Fraunces', Georgia, 'Times New Roman', serif;
  --ui:'DM Sans', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
  --r:10px; --shadow:0 1px 2px rgba(42,26,29,.04), 0 1px 1px rgba(42,26,29,.03);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151012; --surface:#1D1618; --sunk:#241B1E; --line:#31262A; --line-2:#433539;
  --ink:#F2E8E3; --ink-2:#D2C3BE; --muted:#A08F8B;
  --brand:#5C1A2B; --brand-tint:#3A1C24; --on-brand:#FBF3EE; --accent:#E88E72; --blush:#F0BFAE;
  --side:#4A1522; --side-ink:#F3E3DD; --side-muted:#C9A9A6; --side-hover:rgba(255,240,235,.06);
  --t-boda:#E59AA6; --t-empresa:#E88E72; --t-wellness:#A9C08A; --t-otro:#B9A9A1; --t-reu:#9DB8D0; --ch-1:#CF6681; --ch-2:#2C9DC6;
  --ok:#9FCB9F; --ok-bg:#1F3326; --warn:#E9C27A; --warn-bg:#382B14; --off:#BCAEAA; --off-bg:#2C2326; --bad:#F0A3A3; --bad-bg:#3F2023;
  --shadow:none; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#151012; --surface:#1D1618; --sunk:#241B1E; --line:#31262A; --line-2:#433539;
  --ink:#F2E8E3; --ink-2:#D2C3BE; --muted:#A08F8B;
  --brand:#5C1A2B; --brand-tint:#3A1C24; --on-brand:#FBF3EE; --accent:#E88E72; --blush:#F0BFAE;
  --side:#4A1522; --side-ink:#F3E3DD; --side-muted:#C9A9A6; --side-hover:rgba(255,240,235,.06);
  --t-boda:#E59AA6; --t-empresa:#E88E72; --t-wellness:#A9C08A; --t-otro:#B9A9A1; --t-reu:#9DB8D0; --ch-1:#CF6681; --ch-2:#2C9DC6;
  --ok:#9FCB9F; --ok-bg:#1F3326; --warn:#E9C27A; --warn-bg:#382B14; --off:#BCAEAA; --off-bg:#2C2326; --bad:#F0A3A3; --bad-bg:#3F2023;
  --shadow:none; color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:600;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

/* shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.app>*{min-width:0}
aside.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;gap:24px;padding:22px 14px;position:sticky;top:0;height:100vh}
.logo{display:flex;flex-direction:column;align-items:center;gap:10px;padding:6px 8px 18px;border-bottom:1px solid rgba(240,191,174,.14)}
.logo b{font-family:var(--display);font-size:21px;font-weight:600;color:var(--side-ink);letter-spacing:-.01em}
.logo small{font-size:10px;color:var(--side-muted);letter-spacing:.22em;text-transform:uppercase}
.logo .mark{width:34px;height:34px;border-radius:9px;background:var(--blush);color:#5C1A2B;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:-.02em}
.logo b{font-family:var(--display);font-size:17px;font-weight:600;line-height:1.1;display:block}
.logo small{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--side-muted)}
nav.menu{display:flex;flex-direction:column;gap:2px}
nav.menu button{display:flex;align-items:center;gap:11px;border:0;background:none;color:var(--side-muted);padding:9px 10px;border-radius:8px;cursor:pointer;font-weight:500;text-align:left;position:relative}
nav.menu button:hover{background:var(--side-hover);color:var(--side-ink)}
nav.menu button[aria-current="page"]{background:rgba(240,191,174,.12);color:#FFF4EF}
nav.menu button[aria-current="page"]::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--blush)}
nav.menu .count{margin-left:auto;font-size:11px;font-weight:700;background:var(--blush);color:#5C1A2B;border-radius:999px;padding:1px 7px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:0 8px;font-size:12px;color:var(--side-muted)}
.side-foot .who{display:flex;align-items:center;gap:8px}
.side-foot .av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:rgba(240,191,174,.18);color:var(--side-ink)}
.side-foot .av+.av{margin-left:-12px;box-shadow:0 0 0 2px var(--side)}
main{min-width:0;padding:28px 32px 64px;display:flex;flex-direction:column;gap:20px;max-width:1320px;width:100%}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  aside.side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:column;gap:10px;padding:12px 16px 8px;z-index:5}
  .logo{flex-direction:row;justify-content:center;padding:2px 0 8px;align-self:stretch}.logo b{font-size:17px}.logo small{display:none}
  nav.menu{flex-direction:row;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
  nav.menu button{white-space:nowrap;padding:7px 10px}
  nav.menu button[aria-current="page"]::before{display:none}
  .side-foot{display:none}
  main{padding:20px 16px 56px}
}

/* page header */
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.ph h1{font-family:var(--display);font-size:30px;font-weight:600;letter-spacing:-.015em;line-height:1.15}
.ph p{color:var(--muted);margin-top:4px}
.crumb{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-bottom:6px}
.crumb button{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;font-weight:600}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* controls */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--surface);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{background:#6E2235}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--sunk)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.icon{padding:6px}
.btn:disabled{opacity:.55;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,nav.menu button:focus-visible,.tabs button:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.inp,.sel,textarea.inp{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:7px 10px;min-width:0;width:100%}
textarea.inp{min-height:84px;resize:vertical;line-height:1.5}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar .inp,.toolbar .sel{width:auto}
.search{position:relative;flex:1 1 220px;max-width:340px}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--muted);width:16px;height:16px}
.search .inp{padding-left:32px}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.card-h h3{font-size:14px;font-weight:700}
.card-h .sub{font-size:12px;color:var(--muted);font-weight:500}
.card-b{padding:16px 18px}
.card-b.flush{padding:0}
.grid{display:grid;gap:16px}
.g-kpi{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr)}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:1100px){.g-kpi{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){.g-main,.g-2{grid-template-columns:1fr}}
@media (max-width:480px){.g-kpi{grid-template-columns:1fr}}
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.kpi .lab{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .lab svg{width:15px;height:15px}
.kpi .val{font-family:var(--display);font-size:30px;font-weight:600;line-height:1.15;letter-spacing:-.01em}
.kpi .val small{font-family:var(--ui);font-size:13px;font-weight:600;color:var(--muted);margin-left:4px}
.kpi .foot{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi.feature{background:var(--brand);border-color:var(--brand);color:var(--on-brand);position:relative;overflow:hidden}
.kpi.feature .lab,.kpi.feature .foot,.kpi.feature .val small{color:#E7C9C1}
.kpi.feature::after{content:"";position:absolute;right:-40px;top:-40px;width:130px;height:130px;border-radius:50%;border:1px solid rgba(240,191,174,.25);box-shadow:0 0 0 18px rgba(240,191,174,.05)}

/* tables */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.link{cursor:pointer}
tr.link:hover td{background:var(--sunk)}
.r{text-align:right}
.strong{font-weight:600}
.muted{color:var(--muted)}
.small{font-size:12px}

/* chips */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;line-height:1.6}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block;background:var(--c,var(--muted))}
.t-boda{--c:var(--t-boda)} .t-empresa{--c:var(--t-empresa)} .t-wellness{--c:var(--t-wellness)} .t-otro{--c:var(--t-otro)} .t-reu{--c:var(--t-reu)}
.type{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.st-cerrado,.st-ganado,.st-confirmado,.st-pagado{background:var(--ok-bg);color:var(--ok)}
.st-presupuesto,.st-contactado,.st-pendiente{background:var(--warn-bg);color:var(--warn)}
.st-nuevo{background:var(--brand-tint);color:var(--t-boda)}
.st-celebrado{background:var(--off-bg);color:var(--off)}
.st-cancelado,.st-perdido,.st-vencido{background:var(--bad-bg);color:var(--bad)}
.tag-groove{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.bar{height:6px;background:var(--sunk);border-radius:999px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:999px}
.bar.accent i{background:var(--accent)}
.prog{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.prog .bar{flex:1}

/* lists */
.rows{display:flex;flex-direction:column}
.rw{display:flex;gap:12px;align-items:center;padding:11px 18px;border-top:1px solid var(--line)}
.rw:first-child{border-top:0}
.rw.link{cursor:pointer}
.rw.link:hover{background:var(--sunk)}
.rw .grow{flex:1;min-width:0}
.rw .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rw .s{font-size:12px;color:var(--muted)}
.datebox{width:44px;flex:none;text-align:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;line-height:1.1}
.datebox small{display:block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--sunk);color:var(--muted);padding:2px 0}
.datebox b{display:block;font-family:var(--display);font-size:18px;padding:3px 0}
.alert-ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--sunk);color:var(--ink-2)}
.alert-ic.bad{background:var(--bad-bg);color:var(--bad)}
.alert-ic.warn{background:var(--warn-bg);color:var(--warn)}
.alert-ic.ok{background:var(--ok-bg);color:var(--ok)}
.empty{padding:28px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}

/* checkbox */
.chk{appearance:none;width:18px;height:18px;border:1.5px solid var(--line-2);border-radius:5px;display:grid;place-items:center;cursor:pointer;flex:none;margin:0;background:var(--surface)}
.chk:checked{background:var(--ok);border-color:var(--ok)}
.chk:checked::after{content:"";width:9px;height:5px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.done .t{text-decoration:line-through;color:var(--muted)}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand)}
.tabs .n{font-size:11px;background:var(--sunk);border-radius:999px;padding:0 7px;color:var(--ink-2)}
.seg{display:inline-flex;background:var(--sunk);border-radius:8px;padding:3px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:6px;cursor:pointer;font-weight:600;font-size:12px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.ag-f{padding:12px 18px 0}
/* gráficas de negocio */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:16px}
.chart{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--ui)}
.chart .bk{transition:opacity .15s}
.chart:hover .bk{opacity:.55}.chart .bk:hover{opacity:1}
.ch-note{font-size:12px;color:var(--muted);margin-top:10px}
.hb{display:grid;grid-template-columns:96px 1fr auto;align-items:center;gap:10px 12px}
.hb .lb{font-size:13px;font-weight:600;color:var(--ink-2)}
.hb .tr{height:14px;background:var(--sunk);border-radius:4px;overflow:hidden}
.hb .fl{height:100%;background:var(--ch-1);border-radius:0 4px 4px 0}
.hb .vv{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.hb .vv b{color:var(--ink)}
.meter{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;background:var(--surface)}
.meter span{display:block;height:100%}
.tip{position:fixed;z-index:80;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12px;font-weight:600;padding:6px 9px;border-radius:7px;box-shadow:0 6px 20px rgba(0,0,0,.18);white-space:nowrap;transform:translate(-50%,calc(-100% - 10px))}
@media (prefers-reduced-motion:no-preference){
  .grow .bk{transform-box:fill-box;transform-origin:50% 100%;animation:barUp .7s cubic-bezier(.2,.8,.2,1) both}
  .grow .fl{transform-origin:0 50%;animation:barRight .8s cubic-bezier(.2,.8,.2,1) both}
  @keyframes barUp{from{transform:scaleY(0)}}
  @keyframes barRight{from{transform:scaleX(0)}}
}

/* ficha */
.hero-ev{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
.hero-ev .meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--ink-2);margin-top:8px;align-items:center}
.hero-ev .meta span{display:inline-flex;gap:6px;align-items:center}
.count-badge{border:1px solid var(--line);border-radius:12px;padding:10px 16px;text-align:center;background:var(--surface)}
.count-badge b{font-family:var(--display);font-size:30px;display:block;line-height:1.05}
.count-badge small{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.strip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
.strip>div{padding:14px 18px;border-left:1px solid var(--line)}
.strip>div:first-child{border-left:0}
.strip .lab{font-size:12px;color:var(--muted);font-weight:600}
.strip .v{font-family:var(--display);font-size:22px;font-weight:600}
@media (max-width:1000px){.strip{grid-template-columns:repeat(3,minmax(0,1fr))}.strip>div:nth-child(4){border-left:0}.strip>div:nth-child(n+4){border-top:1px solid var(--line)}}
@media (max-width:520px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}.strip>div{border-left:0!important;border-top:1px solid var(--line)}.strip>div:nth-child(-n+2){border-top:0}.strip>div:nth-child(even){border-left:1px solid var(--line)!important}}
dl.kv{display:grid;grid-template-columns:140px minmax(0,1fr);gap:10px 16px;margin:0}
dl.kv dt{color:var(--muted);font-size:13px}
dl.kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.addrow{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr) auto;gap:8px;padding:12px 18px;border-top:1px solid var(--line);background:var(--sunk)}
@media (max-width:640px){.addrow{grid-template-columns:1fr 1fr}.addrow>*:first-child{grid-column:1/-1}}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12px;color:var(--ink-2);font-weight:600}
.full{grid-column:1/-1}
@media (max-width:560px){.fields{grid-template-columns:1fr}dl.kv{grid-template-columns:1fr;gap:2px 0}dl.kv dd{margin-bottom:8px}}

/* calendario */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cal .dow{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center;padding:8px 0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-weight:700}
.cal .day{min-height:96px;background:var(--surface);border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:3px;cursor:pointer;text-align:left;min-width:0}
.cal .day:hover{background:var(--sunk)}
.cal .day.out{background:var(--bg);color:var(--muted)}
.cal .day.sat{background:color-mix(in srgb,var(--surface) 88%,var(--blush) 12%)}
.cal .day.sel{box-shadow:inset 0 0 0 2px var(--brand)}
.cal .day .n{font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink-2);font-weight:600;width:22px;height:22px;display:grid;place-items:center;border-radius:50%}

/* métricas de un evento */
function evm(e){const pagos=e.pagos||[],tareas=e.tareas||[],provs=e.proveedores||[];
  const total=N(e.importe);const cobrado=pagos.filter(p=>p.pagado).reduce((a,p)=>a+N(p.importe),0);
  const plan=pagos.reduce((a,p)=>a+N(p.importe),0);const coste=provs.reduce((a,p)=>a+N(p.coste),0);
  const td=tareas.filter(t=>t.hecha).length;
  return {total,cobrado,pendiente:Math.max(0,(total||plan)-cobrado),coste,margen:total?total-coste:null,tareas:tareas.length,hechas:td,
    pctCobro:(total||plan)?cobrado/(total||plan)*100:0,pctTareas:tareas.length?td/tareas.length*100:0,
    vencidos:pagos.filter(p=>!p.pagado&&p.fecha&&p.fecha<TODAY),tVencidas:tareas.filter(t=>!t.hecha&&t.fecha&&t.fecha<TODAY)}}

const neg=()=>Object.assign({crecimiento:.5,fijo:45000,personas:2,bonus:4000},S.negocio||{});
const curEv=()=>S.eventos.find(e=>e.id===S.evId);

let _whoSel=null;
async function sha256(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function whoStep(n){_whoSel=n;const w=document.getElementById('who'),f=document.getElementById('who-pw');w.querySelector('.who-opts').hidden=!!n;f.hidden=!n;document.getElementById('who-err').textContent='';const p=document.getElementById('who-pass');p.value='';

function showWho(){const w=document.getElementById('who');w.hidden=false;document.body.style.overflow='hidden';whoStep(null)}
function setMe(n){S.me=n;try{localStorage.setItem('ebf-me2',n)}catch(e){}document.getElementById('who').hidden=true;document.body.style.overflow='';paintMe();S.anim=true;render();toast('Hola, '+n)}
function paintMe(){const a=document.getElementById('me-av'),t=document.getElementById('me-name');if(a)a.textContent=(S.me||'L').charAt(0);if(t)t.textContent=S.me||'Laura y Cris'}
document.getElementById('who').addEventListener('click',e=>{const b=e.target.closest('[data-who]');if(b)whoStep(b.dataset.who)});

  if(S.needSeed&&!S.denied)h+=`<div class="banner" style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><span>La base de datos está vacía. ¿Cargamos los eventos, el histórico y la colaboración con Groove?</span><button class="btn primary sm" data-act="seed">Importar datos iniciales</button></div>`;
  if(S.view==='evento'&&!curEv())S.view='eventos';
  if(S.view==='colab'&&!curCo())S.view='colaboraciones';
  h+=({panel:vPanel,agenda:vAgenda,eventos:vEventos,evento:vEvento,contactos:vContactos,colaboraciones:vColaboraciones,colab:vColab,proveedores:vProveedores,negocio:vNegocio}[S.view])();

const ph=(title,sub,actions='',crumb='')=>`<header class="ph"><div>${crumb}<h1>${title}</h1>${sub?`<p>${sub}</p>`:''}</div><div class="actions">${actions}</div></header>`;
function greeting(){const h=new Date().getHours();return h<6?'Buenas noches':h<14?'Buenos días':h<21?'Buenas tardes':'Buenas noches'}

/* ---------- PANEL ---------- */
function vPanel(){
  const up=upcoming();const conf=up.filter(e=>e.estado==='cerrado');const next=up[0];
  let pend=0,venc=0;up.forEach(e=>{const m=evm(e);pend+=m.pendiente;venc+=m.vencidos.reduce((a,p)=>a+N(p.importe),0)});
  const abiertos=S.contactos.filter(c=>['nuevo','contactado','presupuesto'].includes(c.estado));
  const pipe=abiertos.reduce((a,c)=>a+N(c.presupuesto),0);
  const y=today.getFullYear();const ny=activos().filter(e=>yearOf(e.fecha)===String(y+1)).length;
  const dn=next?daysTo(next.fecha):null;
  // tareas próximas
  const tasks=[];up.forEach(e=>(e.tareas||[]).forEach(t=>{if(!t.hecha&&t.fecha&&t.fecha<=addDays(TODAY,21))tasks.push({...t,ev:e})}));tasks.sort((a,b)=>a.fecha.localeCompare(b.fecha));
  return `
  ${ph(`${greeting()}, ${esc(S.me||'Laura y Cris')}`,esc(fLong(TODAY)),`<button class="btn" data-act="new-contacto">${ic('plus')}Contacto</button><button class="btn primary" data-act="new-evento">${ic('plus')}Nuevo evento</button>`)}
  <div class="grid g-kpi">
    <div class="card kpi feature">${next?`<p class="lab">${ic('clock')}Próximo evento</p><p class="val num">${dn===0?'Hoy':dn}<small>${dn===0?'':dn===1?'día':'días'}</small></p><p class="foot">${esc(next.nombre)} · ${esc(fShort(next.fecha))}</p>`:`<p class="lab">${ic('clock')}Próximo evento</p><p class="val">—</p><p class="foot">Sin eventos próximos</p>`}</div>
    <div class="card kpi"><p class="lab">${ic('eventos')}Eventos confirmados</p><p class="val num">${conf.length}</p><p class="foot">${ny} con fecha en ${y+1}</p></div>
    <div class="card kpi"><p class="lab">${ic('euro')}Pendiente de cobro</p><p class="val num">${eur(pend)}</p><p class="foot">${venc?`<span style="color:var(--bad);font-weight:700">${eur(venc)} vencido</span>`:'Ningún cobro vencido'}</p></div>
    <div class="card kpi"><p class="lab">${ic('contactos')}Oportunidades abiertas</p><p class="val num">${abiertos.length}</p><p class="foot">${pipe?eur(pipe)+' en presupuestos':'Sin presupuestos en curso'}</p></div>
  </div>
  ${assistant()}
  <div class="grid g-main">
    <div class="card"><div class="card-h"><h3>Próximos eventos</h3><button class="btn ghost sm" data-nav-to="eventos">Ver todos</button></div>
      ${up.length?`<div class="tbl-wrap"><table><thead><tr><th>Fecha</th><th>Evento</th><th>Estado</th><th>Tareas</th><th class="r">Cobrado</th></tr></thead><tbody>
      ${up.slice(0,8).map(e=>{const m=evm(e);const d=daysTo(e.fecha);return `<tr class="link" data-open="${esc(e.id)}"><td class="num" style="white-space:nowrap"><span class="strong">${esc(fShort(e.fecha))}</span><div class="small muted">${d===0?'Hoy':d===1?'Mañana':'En '+d+' días'}</div></td>
        <td><div class="strong">${esc(e.nombre)}</div><div class="small">${typeTag(e.tipo)}${e.lugar==='groove'?' · <span class="tag-groove">Groove</span>':''}</div></td><td>${pill(e.estado,ESTADOS_EV)}</td>
        <td style="min-width:110px">${m.tareas?`<div class="prog">${bar(m.pctTareas,'accent')}<span class="num">${m.hechas}/${m.tareas}</span></div>`:'<span class="small muted">Sin tareas</span>'}</td>
        <td class="r num">${m.total?`${Math.round(m.pctCobro)} %`:'<span class="small muted">Sin importe</span>'}</td></tr>`}).join('')}</tbody></table></div>`:emptyEv()}
    </div>
    <div class="grid" style="align-content:start">
      <div class="card"><div class="card-h"><h3>Requiere atención</h3></div><div class="rows">${attention(up)}</div></div>
      <div class="card"><div class="card-h"><h3>Tareas próximas</h3><span class="sub">21 días</span></div>
        ${tasks.length?`<div class="rows">${tasks.slice(0,6).map(t=>`<div class="rw"><input type="checkbox" class="chk" data-task="${esc(t.ev.id)}|${esc(t.id)}" aria-label="Marcar hecha"><div class="grow"><p class="t">${esc(t.texto)}</p><p class="s">${esc(t.ev.nombre)}</p></div><span class="small num ${t.fecha<TODAY?'':'muted'}" style="${t.fecha<TODAY?'color:var(--bad);font-weight:700':''}">${esc(fShort(t.fecha))}</span></div>`).join('')}</div>`
        :`<div class="empty small">Nada pendiente en las próximas tres semanas. Cargad una plantilla de tareas en la ficha de cada evento.</div>`}</div>
    </div>
  </div>
  <div class="card"><div class="card-h"><h3>Próximos 12 meses</h3>${legend()}</div><div class="card-b tbl-wrap">${timeline(up)}</div></div>`;
}
function emptyEv(){return `<div class="empty">Todavía no hay eventos.<button class="btn primary" data-act="new-evento">${ic('plus')}Crear el primero</button></div>`}
function legend(){return `<div class="legend">${Object.keys(TIPOS).map(t=>`<span class="t-${t}"><span class="dot"></span>${TIPOS[t]}</span>`).join('')}<span class="t-reu"><span class="dot"></span>Reunión</span></div>`}
function attention(up){const out=[];
  const late=S.contactos.filter(c=>['nuevo','contactado','presupuesto'].includes(c.estado)&&c.siguiente&&c.siguiente<TODAY);
  if(late.length)out.push(['bad','contactos',`${late.length} seguimiento${late.length>1?'s':''} atrasado${late.length>1?'s':''}`,late.slice(0,3).map(c=>c.nombre).join(', '),'nav:contactos']);
  const pv=[];up.forEach(e=>evm(e).vencidos.forEach(p=>pv.push([e,p])));
  if(pv.length)out.push(['bad','euro',`${pv.length} cobro${pv.length>1?'s':''} vencido${pv.length>1?'s':''}`,pv.slice(0,2).map(([e,p])=>`${e.nombre}: ${eur(p.importe)}`).join(' · '),'open:'+pv[0][0].id]);
  const tv=[];up.forEach(e=>evm(e).tVencidas.forEach(t=>tv.push([e,t])));
  if(tv.length)out.push(['warn','clock',`${tv.length} tarea${tv.length>1?'s':''} fuera de plazo`,tv.slice(0,2).map(([e,t])=>t.texto).join(' · '),'open:'+tv[0][0].id]);
  const noImp=up.filter(e=>e.estado==='cerrado'&&!N(e.importe));
  if(noImp.length)out.push(['warn','euro',`${noImp.length} evento${noImp.length>1?'s':''} sin importe`,'Completadlo para ver la previsión real de ingresos.','open:'+noImp[0].id]);
  const noT=up.filter(e=>e.estado==='cerrado'&&!(e.tareas||[]).length&&daysTo(e.fecha)<=180);
  if(noT.length)out.push(['', 'list',`${noT.length} evento${noT.length>1?'s':''} sin plan de tareas`,'Los de los próximos 6 meses. Cargad la plantilla en un clic.','open:'+noT[0].id]);
  const busy=new Set(up.map(e=>e.fecha));let free=0,first=null;for(let i=1;i<=56;i++){const d=new Date(today);d.setDate(d.getDate()+i);if(d.getDay()===6&&!busy.has(iso(d))){free++;first=first||iso(d)}}
  if(free)out.push(['ok','agenda',`${free} sábados libres en 8 semanas`,`El primero, ${fmt(first,{day:'numeric',month:'long'})}. Hueco para vender en Groove.`,'nav:agenda']);
  if(!out.length)return `<div class="empty small">Todo en orden.</div>`;
  return out.slice(0,5).map(([k,i,t,s,a])=>`<div class="rw link" data-go="${esc(a)}"><span class="alert-ic ${k}">${ic(i)}</span><div class="grow"><p class="t" style="white-space:normal">${esc(t)}</p><p class="s">${esc(s)}</p></div>${ic('right')}</div>`).join('')}
function timeline(up){let h='';for(let i=0;i<12;i++){const d=new Date(today.getFullYear(),today.getMonth()+i,1);const k=iso(d).slice(0,7);const evs=up.filter(e=>e.fecha.slice(0,7)===k);

function addPrompt(t){return `Hoy es ${TODAY}. Eres el asistente de la app de El Broche Final (bodas y eventos en Madrid; llevan los eventos del espacio Groove).

function normPending(r){if(!r||typeof r!=='object')return null;const D=/^\d{4}-\d{2}-\d{2}$/;const num=v=>v==null||v===''||isNaN(Number(v))?null:Number(v);const pick=(v,m,d)=>v in m?v:d;

  return {kind:'evento',nombre:String(r.nombre||'').slice(0,120),fecha:D.test(r.fecha)?r.fecha:null,tipo:pick(r.tipo,TIPOS,'otro'),estado:pick(r.estado,{cerrado:1,presupuesto:1},'cerrado'),lugar:pick(r.lugar,LUGARES,'otro'),origen:r.lugar==='groove'?'groove':'broche',invitados:num(r.invitados),importe:num(r.importe),notas:String(r.notas||'')}}

let _pm=null;

    <div class="pm-stage"></div>
    <button class="pm-nav prev" data-pm="prev" aria-label="Anterior">${ic('left')}</button><button class="pm-nav next" data-pm="next" aria-label="Siguiente">${ic('right')}</button>
    <div class="pm-hint">← → para avanzar · L puntero láser · G todas · Esc salir</div>
    <div class="pm-grid" hidden></div><span class="pm-laser" hidden></span>
    ${REDUCED?'':`<div class="pm-intro" aria-hidden="true"><div><p>El Broche Final</p><h2>${esc(name.replace(/\.pdf$/i,''))}</h2><i></i></div></div>`}`;
  document.getElementById('viewer-root').appendChild(el);document.body.classList.add('pm-on');
  const intro=el.querySelector('.pm-intro');if(intro)setTimeout(()=>intro.remove(),1950);
  const stage=el.querySelector('.pm-stage'),ct=el.querySelector('.pm-ct'),bar=el.querySelector('.pm-prog i'),grid=el.querySelector('.pm-grid'),hint=el.querySelector('.pm-hint');
  const P=_pm={el,cancel:false,i:0,cache:new Map(),busy:null};
  const dpr=Math.min(devicePixelRatio||1,2);
  const box=()=>({w:Math.max(200,stage.clientWidth-(innerWidth>640?150:24)),h:Math.max(150,stage.clientHeight-(innerWidth>640?40:16))});
  async function bmp(i){const k=i+'@'+stage.clientWidth+'x'+stage.clientHeight;if(P.cache.has(k))return P.cache.get(k);
    const pr=(async()=>{const page=await pdf.getPage(i);const v0=page.getViewport({scale:1});const b=box();const sc=Math.min(b.w/v0.width,b.h/v0.height);const vp=page.getViewport({scale:sc*dpr});
      const c=document.createElement('canvas');c.width=Math.round(vp.width);c.height=Math.round(vp.height);await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;c._w=vp.width/dpr;c._h=vp.height/dpr;return c})();
    P.cache.set(k,pr);return pr}
  async function show(i,dir){i=Math.max(1,Math.min(n,i));if(i===P.i&&dir!==0)return;const tok=P.tok=(P.tok||0)+1;P.i=i;

    const sl=document.createElement('div');sl.className='pm-sl';
    const g=document.createElement('canvas');g.className='pm-glow';g.width=48;g.height=Math.max(1,Math.round(48*src.height/src.width));g.getContext('2d').drawImage(src,0,0,g.width,g.height);g.setAttribute('aria-hidden','true');
    const c=document.createElement('canvas');c.width=src.width;c.height=src.height;c.style.width=src._w+'px';c.style.height=src._h+'px';c.getContext('2d').drawImage(src,0,0);c.setAttribute('role','img');c.setAttribute('aria-label','Diapositiva '+i+' de '+n);
    sl.appendChild(g);sl.appendChild(c);card.appendChild(sl);
    if(i===n&&dir>0&&!P.fin){P.fin=true;setTimeout(()=>{if(_pm===P)confetti()},500)}
    stage.querySelectorAll('.pm-card:not(.out)').forEach(o=>{if(!dir){o.remove();return}o.classList.add('out');o.style.setProperty('--dx',dir<0?-1:1);setTimeout(()=>o.remove(),560)});
    stage.appendChild(card);
    [i+1,i-1,i+2].forEach(k=>{if(k>=1&&k<=n)bmp(k).catch(()=>{})});

      for(let k=1;k<=n;k++){if(P.cancel||grid.hidden&&k>1)break;const page=await pdf.getPage(k);const v0=page.getViewport({scale:1});const vp=page.getViewport({scale:360/v0.width});const c=grid.querySelector(`.pm-th[data-i="${k}"] canvas`);if(!c)break;c.width=vp.width;c.height=vp.height;await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise}}

  el.addEventListener('click',e=>{const b=e.target.closest('[data-pm],.pm-th');if(b){e.stopPropagation();if(b.classList.contains('pm-th')){grid.hidden=true;el.querySelector('[data-pm="grid"]').setAttribute('aria-pressed','false');const t=+b.dataset.i;show(t,t<P.i?-1:1);return}

/* confeti sutil */
function confetti(){if(REDUCED)return;const c=document.getElementById('fx'),x=c.getContext('2d'),dpr=devicePixelRatio||1,W=c.width=innerWidth*dpr,H=c.height=innerHeight*dpr;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';
  const cols=['#5C1A2B','#A8452F','#F0BFAE','#E9C9A0'];const ps=Array.from({length:70},()=>({x:W*(.35+Math.random()*.3),y:H*.3,vx:(Math.random()-.5)*10*dpr,vy:(-Math.random()*11-4)*dpr,r:(Math.random()*3+2)*dpr,c:cols[Math.random()*4|0],a:Math.random()*6,va:(Math.random()-.5)*.25}));
  const t0=performance.now();const fr=t=>{x.clearRect(0,0,W,H);const k=(t-t0)/1500;ps.forEach(p=>{p.vy+=.35*dpr;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.globalAlpha=Math.max(0,1-k);x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r,p.r,p.r*2);x.restore()});if(k<1)requestAnimationFrame(fr);else x.clearRect(0,0,W,H)};requestAnimationFrame(fr)}

  async delete(id) {
    const m = await getDoc(doc(fs, "archivos", id)); if (!m.exists()) return;
    for (let i = 0; i < (m.data().partes || 0); i++) await deleteDoc(doc(fs, "archivos", id, "partes", String(i)));

}
